[metadata]
name = agent-context-handoff
version = 1.0.3
description = Agent-neutral engineering context handoff Skill and CLI
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = wangerpan
url = https://github.com/wangerpan/agent-context-handoff
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = agent_context_handoff*

[options.package_data]
agent_context_handoff =
    templates/*.md

[options.entry_points]
console_scripts =
    agent-context-handoff = agent_context_handoff.cli:main
